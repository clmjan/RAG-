services:
  rag:
    build:
      context: .
      args:
        VITE_API_BASE: ""
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/runtime/knowledge.db
      UPLOAD_DIR: /app/runtime/uploads
    volumes:
      - rag_data:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  rag_data:
