name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Lint Python
        run: ruff check app tests --select E9,F63,F7,F82 --output-format=concise
      - name: Run pytest
        run: pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
